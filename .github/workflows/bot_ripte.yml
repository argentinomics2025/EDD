name: "EC-021 Etapa 3 | RIPTE oficial - solo lectura"
# No schedule or DB access until source, duplicate 2026-01 and rollback are cleared.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bot_ripte.yml"
      - "scripts/bot_ripte.py"
      - "tests/test_ec021_ripte_safe.py"
permissions:
  contents: read
jobs:
  ripte_readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded read dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify parser and strict historical guard (synthetic, no database)
        run: python -m unittest discover -s tests -p 'test_ec021_ripte_safe.py' -v
      - name: Read official Ministry RIPTE page (no database credentials)
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.bot_ripte
