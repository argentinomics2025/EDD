name: EC-016 manual - SHA autorizado - NO APTO PARA PRODUCCION

on:
  workflow_dispatch:
    inputs:
      lab_sha:
        description: 'SHA completo revisado del laboratorio (40 caracteres hexadecimales)'
        required: true
        type: string
      confirmation:
        description: 'Escribir EC016_DISPOSABLE_ONLY: seguido del mismo SHA completo'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ec016-manual-laboratory
  cancel-in-progress: false

env:
  EC016_GITHUB_DISPOSABLE: EC016_DISPOSABLE_ONLY
  EC016_SOURCE_SHA: ${{ inputs.lab_sha }}
  EC016_MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
  EC016_APPROVED_SHA: ${{ vars.EC016_APPROVED_SHA }}
  PYTHONDONTWRITEBYTECODE: '1'
  EC016_POSTGRES_IMAGE: docker.io/library/postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
  EC016_POSTGREST_IMAGE: docker.io/postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
  EC016_PYTHON_IMAGE: docker.io/library/python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e

jobs:
  scan:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'argentinomics2025/EDD' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      lab_sha: ${{ steps.authorization.outputs.sha }}
    env:
      EC016_SCAN_RUNNER_TAG: ec016-scan-runner:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Trusted policy lives ONLY in main; no experimental checkout before this step.
      # Single-operator authorization, deliberately NOT a simulated second review.
      - name: Autorizar SHA exacto antes de descargar codigo experimental
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          e = os.environ
          sha = e.get('EC016_SOURCE_SHA', '')
          approved = e.get('EC016_APPROVED_SHA', '')
          with open(e['GITHUB_EVENT_PATH']) as event_file:
              event = json.load(event_file)
          fixed = {
              'GITHUB_ACTIONS': 'true',
              'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_REPOSITORY': 'argentinomics2025/EDD',
              'GITHUB_REF': 'refs/heads/main',
              'GITHUB_WORKFLOW_REF': 'argentinomics2025/EDD/.github/workflows/ec016_integration.yml@refs/heads/main',
              'RUNNER_ENVIRONMENT': 'github-hosted',
              'RUNNER_OS': 'Linux', 'RUNNER_ARCH': 'X64', 'ImageOS': 'ubuntu24',
          }
          valid = (
              all(e.get(k) == v for k, v in fixed.items())
              and e.get('GITHUB_RUN_ATTEMPT') == '1'
              and re.fullmatch('[a-f0-9]{40}', sha) is not None
              and sha == approved
              and e.get('EC016_MANUAL_CONFIRMATION') == 'EC016_DISPOSABLE_ONLY:' + sha
              and event.get('repository', {}).get('private') is False
              and event.get('repository', {}).get('full_name') == 'argentinomics2025/EDD'
              and event.get('inputs', {}).get('lab_sha') == sha
              and event.get('inputs', {}).get('confirmation') == 'EC016_DISPOSABLE_ONLY:' + sha
          )
          if not valid:
              sys.exit('EC016_DENIED: contexto o autorizacion de SHA invalida; no se descarga el laboratorio.')
          with open(e['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Checkout SHA autorizado
        id: source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.authorization.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Instalar binario Trivy verificado y preparar politica vacia
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ec016-trivy"
          curl --fail --silent --show-error --location --retry 3             https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz             -o "$RUNNER_TEMP/ec016-trivy/trivy.tar.gz"
          echo "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75  $RUNNER_TEMP/ec016-trivy/trivy.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/ec016-trivy/trivy.tar.gz" -C "$RUNNER_TEMP/ec016-trivy" trivy
          mv "$RUNNER_TEMP/ec016-trivy/trivy" "$RUNNER_TEMP/ec016-trivy/trivy-real"
          printf '#!/bin/sh\nexec python3 -m infra.ec016.scan_diagnostics run "$@"\n' > "$RUNNER_TEMP/ec016-trivy/trivy"
          chmod 700 "$RUNNER_TEMP/ec016-trivy/trivy"
          echo "$RUNNER_TEMP/ec016-trivy" >> "$GITHUB_PATH"
          printf '{}\n' > "$RUNNER_TEMP/ec016-trivy/config.yaml"
          : > "$RUNNER_TEMP/ec016-trivy/empty.ignore"
          printf 'TRIVY_CONFIG=%s\nTRIVY_IGNOREFILE=%s\n' "$RUNNER_TEMP/ec016-trivy/config.yaml" "$RUNNER_TEMP/ec016-trivy/empty.ignore" >> "$GITHUB_ENV"
      - name: Construir imagen de dependencias con base y wheels fijados
        shell: bash
        run: |
          set -euo pipefail
          for component in POSTGRES POSTGREST PYTHON; do
            image_var="EC016_${component}_IMAGE"
            docker --host unix:///var/run/docker.sock pull --platform linux/amd64 "${!image_var}" > "$RUNNER_TEMP/ec016-pull.log" 2>&1
            printf 'EC016_SCANNED_%s_ID=%s\n' "$component" "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' "${!image_var}")" >> "$GITHUB_ENV"
          done
          docker --host unix:///var/run/docker.sock build --platform linux/amd64 --build-arg PYTHON_IMAGE="$EC016_PYTHON_IMAGE" \
            -t "$EC016_SCAN_RUNNER_TAG" infra/ec016 > "$RUNNER_TEMP/ec016-build.log" 2>&1
          printf 'EC016_SCANNED_RUNNER_ID=%s\n' "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' "$EC016_SCAN_RUNNER_TAG")" >> "$GITHUB_ENV"
      - name: Escaneo obligatorio PostgreSQL
        id: scan_postgresql
        env:
          EC016_SCAN_SUBJECT: postgresql
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: image
          image-ref: docker.io/library/postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
          version: v0.69.3
          skip-setup-trivy: 'true'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/ec016-trivy/cache
          scanners: vuln
          list-all-pkgs: 'true'
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/ec016-trivy/postgresql.json
          hide-progress: 'true'
          timeout: 10m
      - name: Escaneo obligatorio PostgREST
        id: scan_postgrest
        env:
          EC016_SCAN_SUBJECT: postgrest
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: image
          image-ref: docker.io/postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
          version: v0.69.3
          skip-setup-trivy: 'true'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/ec016-trivy/cache
          scanners: vuln
          list-all-pkgs: 'true'
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/ec016-trivy/postgrest.json
          hide-progress: 'true'
          timeout: 10m
      - name: Escaneo obligatorio Python
        id: scan_python
        env:
          EC016_SCAN_SUBJECT: python
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: image
          image-ref: docker.io/library/python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
          version: v0.69.3
          skip-setup-trivy: 'true'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/ec016-trivy/cache
          scanners: vuln
          list-all-pkgs: 'true'
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/ec016-trivy/python.json
          hide-progress: 'true'
          timeout: 10m
      - name: Escaneo obligatorio Runner y dependencias instaladas
        id: scan_runner
        env:
          EC016_SCAN_SUBJECT: runner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: image
          image-ref: ${{ env.EC016_SCAN_RUNNER_TAG }}
          version: v0.69.3
          skip-setup-trivy: 'true'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/ec016-trivy/cache
          scanners: vuln
          list-all-pkgs: 'true'
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/ec016-trivy/runner.json
          hide-progress: 'true'
          timeout: 10m
      - name: Diagnostico seguro y cierre obligatorio del escaneo
        if: ${{ always() && steps.source.outcome == 'success' }}
        env:
          EC016_SCAN_OUTCOMES: >-
            {"postgresql":"${{ steps.scan_postgresql.outcome }}","postgrest":"${{ steps.scan_postgrest.outcome }}","python":"${{ steps.scan_python.outcome }}","runner":"${{ steps.scan_runner.outcome }}"}
        shell: bash
        run: python3 -m infra.ec016.scan_diagnostics
  integration:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
        env:
          POSTGRES_DB: ec016_disposable
          POSTGRES_USER: ec016_admin
          POSTGRES_PASSWORD: EC016_SYNTHETIC_ADMIN_ONLY
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        options: >-
          --tmpfs /var/lib/postgresql/data
          --memory 768m
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U ec016_admin -d ec016_disposable"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - name: Checkout del mismo SHA que aprobo el escaneo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.scan.outputs.lab_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Crear fixture sintetica en PostgreSQL nativo
        id: bootstrap
        env:
          EC016_POSTGRES_ID: ${{ job.services.postgres.id }}
          EC016_NETWORK: ${{ job.services.postgres.network }}
        run: python3 -m infra.ec016.services bootstrap
      - name: Iniciar PostgREST despues de crear su rol sin privilegios
        run: python3 -m infra.ec016.services postgrest
      - name: Ejecutar exactamente once pruebas sin skips
        run: python3 -m infra.ec016.services test
      - name: Limpiar solo PostgREST propio
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        run: python3 -m infra.ec016.services cleanup
