name: "EC-021.5 INDEC IPC — inspect source only"
# Manual source-inspection utility. NO Supabase credentials, cron or writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccion-fuente-indec:
    name: "INDEC IPC source: HTTP + SHA256 + CSV columns"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout EDD
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read official INDEC CSV (no publication)
        run: python scripts/ec0215_indec_ipc_probe.py
