name: "EC-021.5 | Alertas de fallos IPC INDEC"
# Isolated notification workflow: never checks out untrusted workflow_run code.
# GITHUB_TOKEN is granted issues:write only in the alert job. No Supabase keys.
on:
  workflow_run:
    workflows:
      - "EC-021.5 | IPC nacional INDEC: monitor y escritor acotado"
    types: [completed]
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/ec0215_ipc_failure_alerts.yml"
      - "scripts/ec0215_issue_alert.sh"

permissions:
  contents: read

jobs:
  test_alert_script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and dry runs (no issues, no database)
        env:
          GH_REPO: argentinomics2025/EDD
          EC0215_ALERT_DRY_RUN: "true"
          EC0215_ALERT_SOURCE_URL: https://github.com/argentinomics2025/EDD/actions/runs/45453698274
        run: |
          set -euo pipefail
          bash -n scripts/ec0215_issue_alert.sh
          EC0215_ALERT_MODE=failure bash scripts/ec0215_issue_alert.sh | grep -Fq "EC-021.5 | Falla IPC automatizado"
          EC0215_ALERT_MODE=rehearsal bash scripts/ec0215_issue_alert.sh | grep -Fq "EC-021.5 | PRUEBA de alerta IPC"
          echo "[APROBADO] Sintaxis y dos modos sin efectos externos"

  send_alert:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 5 &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == '/ec0215-alert-test' &&
       github.event.comment.user.login == 'argentinomics2025')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create or update assigned GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          REHEARSAL_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            export EC0215_ALERT_MODE=rehearsal
            export EC0215_ALERT_SOURCE_URL="$REHEARSAL_URL"
          else
            export EC0215_ALERT_MODE=failure
            export EC0215_ALERT_SOURCE_URL="$SOURCE_RUN_URL"
          fi
          bash scripts/ec0215_issue_alert.sh
