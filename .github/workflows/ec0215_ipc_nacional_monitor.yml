name: "EC-021.5 IPC INDEC Nacional — lectura oficial automatica (SOLO LECTURA)"
# Cron checks source and logs latest official monthly value. NO production writes.
# This workflow is NOT the monthly production ingestor; activation subject to DEC-003.
on:
  schedule:
    # November and future publication windows: 12th–22nd, 18:00 Argentina (21:00 UTC).
    - cron: "0 21 12-22 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec0215-ipc-nacional-solo-lectura
  cancel-in-progress: false

jobs:
  ipc-nacional-solo-lectura:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve source code
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read INDEC official national IPC, no Supabase access
        run: python scripts/ec0215_indec_ipc_nacional.py
