name: "EC-021.5 IPC — one-shot official CSV inspection (NO WRITES)"
# Disposable branch-only, read-only verification. No secrets, no database.
on:
  push:
    branches:
      - ec0215-ipc-source-one-shot-20261123

permissions:
  contents: read

jobs:
  leer-csv-indec:
    if: ${{ github.ref == 'refs/heads/ec0215-ipc-source-one-shot-20261123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download INDEC IPC source and report header (NO WRITES)
        run: python scripts/ec0215_indec_ipc_probe.py
