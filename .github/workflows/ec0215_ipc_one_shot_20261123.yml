name: "EC-021.5 IPC — one-shot official CSV inspection (NO WRITES)"
on:
  push:
    branches:
      - ec0215-ipc-source-one-shot-20261123

permissions:
  contents: read

jobs:
  leer-csv-indec:
    if: ${{ github.ref == 'refs/heads/ec0215-ipc-source-one-shot-20261123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read official CSV and show IPC national candidate rows (NO WRITES)
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, ssl
          from collections import Counter
          from urllib.request import Request, build_opener, HTTPSHandler
          from scripts.ec0215_indec_ipc_probe import SOURCE_URL, INDECRedirects, MAX_BYTES

          req = Request(SOURCE_URL, headers={"User-Agent": "EconomiaCriolla-IPC-ReadOnly/1.0"})
          opener = build_opener(INDECRedirects(), HTTPSHandler(context=ssl.create_default_context()))
          with opener.open(req, timeout=20) as response:
              data = response.read(MAX_BYTES + 1)
              assert response.geturl().startswith("https://www.indec.gob.ar/")
              assert len(data) <= MAX_BYTES and b"\\x00" not in data
          try:
              decoded = data.decode("utf-8-sig")
          except UnicodeDecodeError:
              decoded = data.decode("cp1252")
          dialect = csv.Sniffer().sniff("\\n".join(decoded.splitlines()[:5]), delimiters=",;\\t")
          rows = list(csv.DictReader(io.StringIO(decoded), dialect=dialect))
          print("ROW_COUNT",len(rows))
          print("FIRST_ROWS",json.dumps(rows[:2],ensure_ascii=False))
          print("LAST_ROWS",json.dumps(rows[-2:],ensure_ascii=False))
          print("REGIONS",json.dumps(Counter(r["Region"] for r in rows).most_common(20),ensure_ascii=False))
          print("CLASSIFIERS",json.dumps(Counter(r["Clasificador"] for r in rows).most_common(20),ensure_ascii=False))
          print("PERIODS_LAST",json.dumps(sorted(set(r["Periodo"] for r in rows))[-10:],ensure_ascii=False))
          candidates=[r for r in rows if "nivel general" in r["Descripcion_aperturas"].casefold() and "nacional" in r["Region"].casefold()]
          print("NATIONAL_GENERAL_COUNT",len(candidates))
          print("NATIONAL_GENERAL_LAST",json.dumps(candidates[-8:],ensure_ascii=False))
          PY
