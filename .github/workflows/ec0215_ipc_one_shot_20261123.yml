name: "EC-021.5 IPC — validate official NATIONAL monthly series (NO WRITES)"
on:
  push:
    branches:
      - ec0215-ipc-source-one-shot-20261123

permissions:
  contents: read

jobs:
  ipc-nacional-solo-lectura:
    if: ${{ github.ref == 'refs/heads/ec0215-ipc-source-one-shot-20261123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read official INDEC NATIONAL monthly IPC (no DB or publication)
        run: python scripts/ec0215_indec_ipc_nacional.py
