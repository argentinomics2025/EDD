name: EC0215 IPC plan — isolated CI test (TEMPORARY)
on:
  push:
    branches:
      - ec0215-ipc-append-only-plan-20261123
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nine IPC pure planner unit tests (no DB)
        run: python -m unittest discover -v -s tests -p test_ec0215_ipc_insert_plan.py
