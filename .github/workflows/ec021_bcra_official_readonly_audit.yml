name: "EC-021 | BCRA oficial - auditoría de solo lectura"
# Run once on merge; do NOT enable legacy writers or add a cron.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ec021_bcra_official_readonly_audit.yml"
  pull_request:
    paths:
      - ".github/workflows/ec021_bcra_official_readonly_audit.yml"
      - "scripts/ec021_bcra_official_readonly_audit.py"
      - "tests/test_ec021_bcra_official_readonly_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    name: "BCRA v4.0 API vs Supabase; no DML"
    if: github.repository == 'argentinomics2025/EDD'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Fail-closed data and source tests
        run: python -m unittest discover -s tests -p 'test_ec021_bcra_official_readonly_audit.py' -v
      - name: Real official BCRA vs public Supabase, no writes
        if: github.event_name != 'pull_request'
        run: python -m scripts.ec021_bcra_official_readonly_audit
