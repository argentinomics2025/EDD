name: "EC-021 BCRA | oficial, pruebas y escritor exclusivo bloqueado"
on:
  workflow_dispatch:
    inputs:
      check_db:
        description: "Autenticar rol BCRA en transacción solo lectura"
        type: boolean
        default: false
      apply:
        description: "Escritura privada en Supabase (requiere variable de autorización)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/ec021_bcra_safe_writer.py"
      - "tests/test_ec021_bcra_safe_writer.py"
      - ".github/workflows/ec021_bcra_safe_writer.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ec021_bcra_safe_writer.py"
      - "tests/test_ec021_bcra_safe_writer.py"
      - ".github/workflows/ec021_bcra_safe_writer.yml"
permissions:
  contents: read
concurrency:
  group: ec021-bcra-dedicated-writer
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Probar 14 condiciones económicas y de seguridad
        run: python -m unittest discover -s tests -p 'test_ec021_bcra_safe_writer.py' -v
      - name: Leer API BCRA v4.0 real (sin DML)
        run: python -m scripts.ec021_bcra_safe_writer
  check_connection:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_db == true && inputs.apply != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Autenticar y evaluar diferencias sin DML
        env:
          EC021_BCRA_DB_DSN: ${{ secrets.EC021_BCRA_DB_DSN }}
        run: python -m scripts.ec021_bcra_safe_writer --check-db
  guarded_writer:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && vars.EC021_BCRA_WRITES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Primer escritor acotado y transaccional
        env:
          EC021_BCRA_DB_DSN: ${{ secrets.EC021_BCRA_DB_DSN }}
          EC021_BCRA_WRITES_ENABLED: ${{ vars.EC021_BCRA_WRITES_ENABLED }}
        run: |
          set -euo pipefail
          python -m scripts.ec021_bcra_safe_writer --apply
      - name: Segunda corrida — exigir no_change, cero duplicados
        env:
          EC021_BCRA_DB_DSN: ${{ secrets.EC021_BCRA_DB_DSN }}
          EC021_BCRA_WRITES_ENABLED: ${{ vars.EC021_BCRA_WRITES_ENABLED }}
        run: |
          set -euo pipefail
          python -m scripts.ec021_bcra_safe_writer --apply | tee /tmp/bcra-second.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/bcra-second.json').read_text())
          if result.get('mode') != 'no_change' or result.get('applied') is not False:
              raise SystemExit('BCRA replay not idempotent')
          print('EC021_BCRA_IDEMPOTENT_REPLAY_PASS')
          PY
