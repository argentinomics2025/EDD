name: EC-021 COMEX — monitor oficial y writer protegido

on:
  schedule:
    # 20:13 UTC, ventana post-publicación y primeros días del mes siguiente
    - cron: '13 20 20-28 * *'
    - cron: '13 20 1-5 * *'
  workflow_dispatch:
    inputs:
      release_month:
        description: 'Mes de publicación YYYY-MM; vacío = mes objetivo del calendario'
        required: false
        type: string
      apply:
        description: 'Intentar INSERT-only (exige kill switch y credencial exclusivos)'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - scripts/ec021_comex_latest_link.py
      - scripts/ec021_comex_writer.py
      - tests/test_ec021_comex_writer.py
      - .github/workflows/ec021_comex_monthly.yml

permissions:
  contents: read

concurrency:
  group: ec021-comex-monthly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      release_month: ${{ steps.period.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup audited dependencies
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Unit and source safety tests
        run: |
          python -m unittest discover -s tests -p 'test_ec021_comex_discovery.py' -v
          python -m unittest discover -s tests -p 'test_ec021_comex_writer.py' -v
      - name: Resolve exact release month (no credentials)
        id: period
        env:
          INPUT_RELEASE_MONTH: ${{ inputs.release_month }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            month="2026-11"
          elif [ -n "${INPUT_RELEASE_MONTH}" ]; then
            month="${INPUT_RELEASE_MONTH}"
          elif [ "$(date -u +%d)" -le 5 ]; then
            month="$(date -u -d 'last month' +%Y-%m)"
          else
            month="$(date -u +%Y-%m)"
          fi
          if ! [[ "${month}" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Invalid COMEX release month"; exit 1
          fi
          echo "value=${month}" >> "$GITHUB_OUTPUT"
      - name: INDEC XLS discovery and schema audit (read-only)
        run: python scripts/ec021_comex_writer.py --release-month "${{ steps.period.outputs.value }}"

  writer:
    needs: monitor
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.EC021_COMEX_WRITES_ENABLED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == true))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ec021-comex-writer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2 'psycopg[binary]==3.2.9'
      - name: Append only (all checks must pass; no historical UPDATE/DELETE)
        env:
          EC021_COMEX_DB_DSN: ${{ secrets.EC021_COMEX_DB_DSN }}
          EC021_COMEX_WRITES_ENABLED: ${{ vars.EC021_COMEX_WRITES_ENABLED }}
        run: python scripts/ec021_comex_writer.py --release-month "${{ needs.monitor.outputs.release_month }}" --commit

  alert:
    needs: [monitor, writer]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.monitor.result == 'failure' || needs.writer.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one deduplicated failure issue for the release month
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MONTH: ${{ needs.monitor.outputs.release_month }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
          WRITER_RESULT: ${{ needs.writer.result }}
        run: |
          set -euo pipefail
          month="${TARGET_MONTH:-$(date -u +%Y-%m)}"
          if ! [[ "${month}" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then month="$(date -u +%Y-%m)"; fi
          title="EC-021 COMEX ${month}: monitor o writer falló"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title,number --jq '.[] | select(.title == "'"$title"'") | .number' | head -1)"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "EC-021 COMEX fail-closed. Fecha $(date -u +%F). Monitor: ${MONITOR_RESULT}; escritor: ${WRITER_RESULT}. Revisar [run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Sin cargar ni reescribir históricos. No reactivar bot_comex.yml."
          else
            echo "Existing issue #$existing; deduplicated"
          fi
