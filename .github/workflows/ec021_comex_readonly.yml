name: EC-021 COMEX INDEC — lectura oficial (sin escrituras)
on:
  workflow_dispatch:
  push:
    branches: [ec021-comex-safe-20261126]
    paths:
      - scripts/ec021_comex_readonly.py
      - tests/test_ec021_comex_readonly.py
      - .github/workflows/ec021_comex_readonly.yml
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_ec021_comex_readonly.py' -v
      - run: python scripts/ec021_comex_readonly.py
