name: EC-021 COMEX — inspección XLS oficial sin escrituras
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ec021_comex_xls_audit.py
      - .github/workflows/ec021_comex_xls_audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect_official_xls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - run: python scripts/ec021_comex_xls_audit.py
