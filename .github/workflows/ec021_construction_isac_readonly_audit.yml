name: "EC-021 | Construcción INDEC - auditoría ISAC de solo lectura"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ec021_construction_isac_readonly_audit.yml"
      - "scripts/ec021_construction_isac_readonly_audit.py"
  pull_request:
    paths:
      - ".github/workflows/ec021_construction_isac_readonly_audit.yml"
      - "scripts/ec021_construction_isac_readonly_audit.py"
      - "tests/test_ec021_construction_isac_readonly_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    name: "ISAC datos.gob.ar contra Supabase, solo lectura"
    if: github.repository == 'argentinomics2025/EDD'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test safe ISAC validation
        run: python -m unittest discover -s tests -p 'test_ec021_construction_isac_readonly_audit.py' -v
      - name: Compare source/DB without writes
        run: python -m scripts.ec021_construction_isac_readonly_audit
