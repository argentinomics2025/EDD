name: "EC-021 | Dólar - auditoría de solo lectura"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ec021_dollar_readonly_audit.yml"
  pull_request:
    paths:
      - ".github/workflows/ec021_dollar_readonly_audit.yml"
      - "scripts/ec021_dollar_readonly_audit.py"
      - "tests/test_ec021_dollar_readonly_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    name: "DolarApi vs Supabase; sin DML"
    if: github.repository == 'argentinomics2025/EDD'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test parse and quote guards
        run: python -m unittest discover -s tests -p 'test_ec021_dollar_readonly_audit.py' -v
      - name: Real DollarApi and public dashboard comparison, no writes
        if: github.event_name != 'pull_request'
        run: python -m scripts.ec021_dollar_readonly_audit
