name: "EC-021 Dolar safe writer - read-only until authorization"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test_and_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - run: python -m unittest discover -s tests -p 'test_ec021_dollar_safe_writer.py' -v
      - run: python -m scripts.ec021_dollar_safe_writer
# No schedule, DB secret, or production writer job until separate licensing and credential review.
