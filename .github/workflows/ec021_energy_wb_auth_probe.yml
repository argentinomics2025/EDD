name: EC-021 Energía — verificación privada de conexión (solo lectura)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ec021_energy_wb_auth_probe.yml
permissions:
  contents: read
  issues: write
jobs:
  verify-only:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned postgres client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
      - name: Verify credential and existing October monthly data, NO DML
        env:
          EC021_ENERGY_WB_DB_DSN: ${{ secrets.EC021_ENERGY_WB_DB_DSN }}
        run: python -m scripts.ec021_energy_wb_writer --check-db
      - name: Record successful read-only connection check in EC-021 issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: gh issue comment 62 -R "$REPO" --body "EC-021 Energía: comprobación GitHub Actions DB --check-db EXIT 0, rol exclusivo validado, read-only, applied=false. Commit $SHA; ejecución https://github.com/$REPO/actions/runs/$RUN_ID. No se habilitaron escrituras."
      - name: Record failed read-only connection check in EC-021 issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: gh issue comment 62 -R "$REPO" --body "EC-021 Energía: comprobación de conexión privada FALLÓ, sin escrituras. Commit $SHA; ver logs https://github.com/$REPO/actions/runs/$RUN_ID. No publicar credenciales."
