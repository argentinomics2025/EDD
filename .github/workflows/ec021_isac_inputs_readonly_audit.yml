name: EC-021 ISAC — insumos fuente oficial vs Supabase (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ec021_isac_inputs_readonly_audit.py
      - .github/workflows/ec021_isac_inputs_readonly_audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Compare original inputs source with Supabase, no credentials, no writes
        run: python -m scripts.ec021_isac_inputs_readonly_audit
