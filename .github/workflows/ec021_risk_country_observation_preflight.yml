name: "EC-021 | Riesgo País — preflight de dato pendiente"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ec021_risk_country_observation_preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Source row plus immutable historical overlap (no writes)
        run: python -m scripts.ec021_risk_country_observation_preflight
