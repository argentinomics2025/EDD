name: "EC-021 Riesgo Pais | Vigilancia sin publicacion"
on:
  schedule:
    - cron: "0 3 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ec021_risk_country_watchdog.yml"]
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Tests sin escritura
        run: python -m unittest discover -s tests -p 'test_ec021_risk_country_*.py' -v
      - name: Consultar ArgentinaDatos y Supabase, sin publicar
        id: read
        run: |
          python -m scripts.ec021_risk_country_watchdog > /tmp/risk-report.json
          cat /tmp/risk-report.json
          python - <<'PY'
          import json,os
          o=json.load(open('/tmp/risk-report.json'))
          assert o['writes_to_supabase'] is False
          assert o['publishes_to_website'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('status','last_source_date','last_stored_date'):
                  print(f'{k}={o[k]}',file=f)
          PY
      - name: Aviso editorial deduplicado, no republicar EMBI
        if: steps.read.outputs.status == 'source_ahead_publication_blocked'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EC021_RISK_SOURCE_DATE: ${{ steps.read.outputs.last_source_date }}
          EC021_RISK_STORED_DATE: ${{ steps.read.outputs.last_stored_date }}
        run: bash scripts/ec021_risk_country_alert.sh
