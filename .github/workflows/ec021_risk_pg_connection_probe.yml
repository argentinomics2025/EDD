name: "EC-021 | Riesgo País conexión PG — solo lectura"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ec021_risk_pg_connection_probe.yml"
      - "scripts/ec021_risk_pg_connection_probe.py"
  pull_request:
    paths:
      - ".github/workflows/ec021_risk_pg_connection_probe.yml"
      - "scripts/ec021_risk_pg_connection_probe.py"
      - "tests/test_ec021_risk_pg_connection_probe.py"
permissions:
  contents: read
jobs:
  connection_preflight:
    name: "Credencial exclusiva: conexión y transacción READ ONLY"
    if: github.repository == 'argentinomics2025/EDD'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Unit tests no DB secrets
        run: python -m unittest discover -s tests -p 'test_ec021_risk_pg_connection_probe.py' -v
      - name: Real dedicated PG user and public snapshots (no writes)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EC021_RISK_DB_DSN: "${{ secrets.EC021_RISK_DB_DSN }}"
        run: python -m scripts.ec021_risk_pg_connection_probe
