# EC-020.2: keepalive sin escritura ni ejecución automática.
# Se mantiene únicamente un diagnóstico manual, con permisos mínimos.
name: Keepalive — verificación manual sin escrituras

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar acceso de lectura
        uses: actions/checkout@v4
      - name: Informe no productivo
        run: echo 'Verificación manual. No se generan commits ni pushes.'
