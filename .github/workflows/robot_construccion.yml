name: "EC-021 ISAC legacy — DESHABILITADO (series incompatibles)"
# El bot anterior consultaba serie original y hacía upsert sobre la
# serie desestacionalizada publicada. No ejecutar escrituras heredadas.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed
        run: |
          echo "::error::ISAC legacy BLOQUEADO: mezcla serie original y desestacionalizada; tampoco se permite upsert de insumos con credencial compartida."
          exit 1
