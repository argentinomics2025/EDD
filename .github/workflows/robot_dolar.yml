name: 💵 Robot Dólar (Tiempo Real e Historial)

on:
  workflow_dispatch: 
  
  schedule:
    # Una consulta cada tres horas, según recomendación DolarAPI.
    # 11:00, 14:00 y 17:00 de Argentina, lunes a viernes.
    - cron: '0 14,17,20 * * 1-5'

concurrency:
  group: ec021-dollar-legacy-writer
  cancel-in-progress: false

jobs:
  actualizar-dolares:
    name: Extraer Cotizaciones
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install supabase requests

    - name: Validar las reglas de la fuente antes de escribir
      run: python -m unittest discover -s tests -p 'test_ec021_dollar_safe_writer.py' -v

    - name: Ejecutar Robot del Dólar
      env:
        TZ: 'America/Argentina/Buenos_Aires' 
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python scripts/actualizar_dolar.py
