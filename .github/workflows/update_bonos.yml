name: 📉 Robot Bonos (Mercado)

# EC-007.2: bloqueo temporal. No programar nuevas ejecuciones de bonos.
# Rehabilitar requiere aprobacion separada y validacion de seguridad/datos.
on:
  workflow_dispatch:

jobs:
  actualizar-bonos:
    # Defensa adicional: un dispatch manual tampoco ejecuta el robot.
    if: ${{ false }}
    name: Scraping y Cálculo Matemático
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install supabase selenium webdriver-manager

    - name: Ejecutar Robot
      env:
        TZ: 'America/Argentina/Buenos_Aires'
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python scripts/actualizar_bonos.py
