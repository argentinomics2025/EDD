name: "EC-021 | Riesgo País ArgentinaDatos - validación sin publicación"
# Scheduled READ ONLY; no DB write credential, no commercial EMBI redistribution.
on:
  schedule:
    - cron: "0 3 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update_riesgo_pais.yml"
      - "scripts/ec021_risk_country_readonly.py"
      - "scripts/ec021_risk_country_alert.sh"
      - "scripts/update_riesgo_pais.py"
  pull_request:
    paths:
      - ".github/workflows/update_riesgo_pais.yml"
      - "scripts/ec021_risk_country_readonly.py"
      - "scripts/ec021_risk_country_alert.sh"
      - "scripts/update_riesgo_pais.py"
      - "tests/test_ec021_risk_country_readonly.py"
permissions:
  contents: read
concurrency:
  group: ec021-risk-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  legal_and_safety_gate:
    name: "Riesgo País: monitor de lectura y alerta editorial"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Unit tests (no production calls)
        run: python -m unittest discover -s tests -p 'test_ec021_risk_country_readonly.py' -v
      - name: Test alert script without network or issues
        env:
          GH_TOKEN: dry-run-token
          GH_REPO: argentinomics2025/EDD
          EC021_RISK_SOURCE_DATE: "2026-11-24"
          EC021_RISK_STORED_DATE: "2026-11-23"
          EC021_RISK_ALERT_DRY_RUN: "true"
        run: |
          bash -n scripts/ec021_risk_country_alert.sh
          bash scripts/ec021_risk_country_alert.sh | grep -Fq "publicación bloqueada"
      - name: ArgentinaDatos vs Supabase (read-only, never publish)
        id: risk_monitor
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m scripts.ec021_risk_country_readonly | tee /tmp/ec021-risk-result.json
          python - <<'PY'
          import json, os
          with open("/tmp/ec021-risk-result.json", encoding="utf-8") as f:
              data = json.load(f)
          if data["writes_to_supabase"] is not False or data["publishes_to_website"] is not False:
              raise RuntimeError("Risk-country monitor unexpectedly publishes")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key in ("status", "last_source_date", "last_stored_date"):
                  print(f"{key}={data[key]}", file=f)
          PY
      - name: Confirm the legacy write path is permanently blocked
        run: |
          python - <<'PY'
          from scripts.update_riesgo_pais import run, RiskCountryLicenseBlocked
          try:
              run()
          except RiskCountryLicenseBlocked:
              print("Risk-country historical writer remains safely blocked")
          else:
              raise SystemExit("Unexpected writer activation")
          PY
      - name: Alert editor about source data pending rights, never publish
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && steps.risk_monitor.outputs.status == 'source_ahead_publication_blocked'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EC021_RISK_SOURCE_DATE: ${{ steps.risk_monitor.outputs.last_source_date }}
          EC021_RISK_STORED_DATE: ${{ steps.risk_monitor.outputs.last_stored_date }}
        run: bash scripts/ec021_risk_country_alert.sh
